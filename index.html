  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Preloader Layer */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #ffffff 0%, #fff7ed 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
    }
    #preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-container {
      position: relative;
      margin-bottom: 20px;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.35);
      background: #ffffff;
      padding: 6px;
      position: relative;
      z-index: 2;
    }
    .logo-halo {
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.35) 0%, rgba(249, 115, 22, 0) 70%);
      animation: pulse-halo 2.5s infinite ease-in-out;
      z-index: 1;
    }
    @keyframes pulse-halo {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 0.2; }
    }
    .brand-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ea580c;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 22px;
      font-weight: 400;
      text-align: center;
      padding: 0 16px;
      line-height: 1.5;
    }
    .spinner-ring {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3.5px solid #fed7aa;
      border-radius: 50%;
      border-top-color: #ea580c;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 0.85rem;
      color: #64748b;
    }

    /* Fullscreen iFrame */
    #nlcsFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 1;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Premium Preloader Layer -->
  <div id="preloader">
    <div class="logo-container">
      <div class="logo-halo"></div>
      <img src="https://lh3.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop" alt="NU Logo" class="logo-img">
    </div>
    <div class="brand-title">NLCS</div>
    <div class="brand-subtitle">ระบบบริหารจัดการฐานข้อมูลศูนย์การเรียนรู้ทางการพยาบาล<br><span style="font-size: 0.82rem; color: #94a3b8;">คณะพยาบาลศาสตร์ มหาวิทยาลัยนเรศวร</span></div>
    <div class="spinner-ring"></div>
    <div class="status-text">กำลังเชื่อมต่อระบบ กรุณารอสักครู่...</div>
  </div>

  <!-- Google Apps Script Web App Fullscreen Frame -->
  <iframe 
    id="nlcsFrame" 
    src="https://script.google.com/macros/s/AKfycbxULOx4oIS3odP1V7W0BTGJfxzh1-iesTcrbbVNhMA9kRKQi9TZLKuZX846tCdCfqD4/exec"
    allow="camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write"
    onload="hidePreloader()">
  </iframe>

  <script>
    // Append query params if passed through short url
    (function() {
      var iframe = document.getElementById('nlcsFrame');
      if (iframe && window.location.search) {
        var baseSrc = "https://script.google.com/macros/s/AKfycbxULOx4oIS3odP1V7W0BTGJfxzh1-iesTcrbbVNhMA9kRKQi9TZLKuZX846tCdCfqD4/exec";
        iframe.src = baseSrc + window.location.search;
      }
    })();

    function hidePreloader() {
      var loader = document.getElementById('preloader');
      if (loader && !loader.classList.contains('loaded')) {
        setTimeout(function() {
          loader.classList.add('loaded');
        }, 500);
      }
    }

    // Safety timeout: hide preloader within 3.5 seconds
    setTimeout(function() {
      hidePreloader();
    }, 3500);
  </script>

</body>
